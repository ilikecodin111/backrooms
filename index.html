function castSingleRay(angle){

let x = player.x;
let y = player.y;

let dist = 0;

const step = 0.03;

while(dist < 20){

    x += Math.cos(angle) * step;
    y += Math.sin(angle) * step;

    dist += step;

    const tile =
        map[Math.floor(y)]
        ?.[Math.floor(x)];

    if(tile === 1 || (tile === 4 && specialSolid)){

        // exact hit position inside tile
        const hitX = x - Math.floor(x);
        const hitY = y - Math.floor(y);

        return {
            distance: dist,
            tile,
            hitX,
            hitY
        };
    }
}

return {
    distance:20,
    tile:0,
    hitX:0,
    hitY:0
};

}function castRays(){
    const rays=[];
    const numRays =
Math.floor(canvas.width/2);
    for(let i=0;i<numRays;i++){
        let angle=player.angle-player.fov/2+i*(player.fov/numRays);
        let hit=castSingleRay(angle);
        hit.angle=angle;
        rays.push(hit);
    }

    return rays;
}

            const angleToEnemy = Math.atan2(enemy.y - player.y, enemy.x - player.x);

            let angleDiff = Math.abs(player.angle - angleToEnemy);

            while(angleDiff > Math.PI){
                angleDiff -= Math.PI * 2;

            if(angleDiff < player.fov / 2){
                return;

        if(enemy.power === "watcher-blink"){

const angleToEnemy = Math.atan2(enemy.y - player.y, enemy.x - player.x);

let angleDiff = Math.abs(player.angle - angleToEnemy);

while(angleDiff > Math.PI){
    angleDiff -= Math.PI * 2;
}

angleDiff = Math.abs(angleDiff);

// If player is looking near enemy, freeze it
if(angleDiff < player.fov / 2){
    return;
}
}

        let moveX = (dx / dist) * speed;
        let moveY = (dy / dist) * speed;

        const tileX =
            map[Math.floor(enemy.y)]
            ?.[Math.floor(enemy.x + moveX)];

        const tileY =
            map[Math.floor(enemy.y + moveY)]
            ?.[Math.floor(enemy.x)];

        let blockedX =

            }

            if(enemy.stuckTime > 60){

        if(enemy.power === "watcher-blink"){

if(blockedX || blockedY){

} else {

}

if(enemy.stuckTime > 60){

}
}

        if(!blockedX){

function render3D(rays){

const sliceWidth =
canvas.width / rays.length;

for(let i=0;i<rays.length;i++){

const ray = rays[i];

if(ray.tile!==1)
continue;

const corrected =
ray.distance *
Math.cos(
ray.angle-player.angle
);

const wallHeight =
canvas.height /
Math.max(corrected,0.001);

// stable texture
const texCoord =
(ray.hitX<0.02||ray.hitX>0.98)
? ray.hitY
: ray.hitX;

const texX =
Math.floor(
texCoord*
wallTexture.width
);

ctx.drawImage(

wallTexture,

texX,
0,
1,
wallTexture.height,

i*sliceWidth,
canvas.height/2-wallHeight/2,
sliceWidth+1,
wallHeight

);

// DISTANCE FOG
const fog =
Math.min(
corrected/9,
0.95
);

ctx.fillStyle=
`rgba(0,0,0,${fog})`;

ctx.fillRect(

i*sliceWidth,

canvas.height/2-wallHeight/2,

sliceWidth+1,

wallHeight

);

}

}// SPRITES

function drawSprites(rays){

enemies.forEach(enemy=>{

const dx = enemy.x-player.x;
const dy = enemy.y-player.y;

const dist = Math.hypot(dx,dy);

let angle =
Math.atan2(dy,dx)-player.angle;

angle =
Math.atan2(
Math.sin(angle),
Math.cos(angle)
);

if(
Math.abs(angle) >
player.fov/2
) return;

// screen position
const screenX =
(
(angle+player.fov/2)
/
player.fov
)
*
canvas.width;

// FIX:
// convert screen position → ray index
const rayIndex =
Math.floor(
(screenX/canvas.width)
*
rays.length
);

if(
rayIndex < 0 ||
rayIndex >= rays.length
) return;

// depth check
if(
dist >
rays[rayIndex].distance
) return;

const size =
canvas.height /
Math.max(
dist,
0.1
);

ctx.drawImage(
enemyTexture,
screenX-size/2,
canvas.height/2-size/2,
size,
size
);

});

}// =======================
function drawExit(rays) {
    const tileSize = 1;

    for (let y = 0; y < map.length; y++) {
        for (let x = 0; x < map[y].length; x++) {

            if (map[y][x] !== 3) continue;

            const dx = (x + 0.5) - player.x;
            const dy = (y + 0.5) - player.y;

            const dist = Math.hypot(dx, dy);

            let angle = Math.atan2(dy, dx) - player.angle;

            // normalize angle properly
            angle = Math.atan2(Math.sin(angle), Math.cos(angle));

            if (Math.abs(angle) > player.fov / 2) continue;

            const correctedDist = dist * Math.cos(angle);
            if (correctedDist <= 0.01) continue;

            const size = canvas.height / correctedDist;

            const screenX =
                (0.5 + angle / player.fov) * canvas.width;

            // 🔥 instead of single rayIndex, sample a range
            const rayCenter = Math.floor((screenX / canvas.width) * rays.length);
            const spread = 4;

            let visible = false;

            for (let i = -spread; i <= spread; i++) {
                const r = rayCenter + i;

                if (r < 0 || r >= rays.length) continue;

                // looser threshold fixes corner flicker
                if (correctedDist < rays[r].distance + 1.2) {
                    visible = true;
                    break;
                }
            }

            if (visible) {
                ctx.drawImage(
                    exitTexture,
                    screenX - size / 2,
                    canvas.height / 2 - size / 2,
                    size,
                    size
                );
            }
        }
    }
}


function drawSpecial(rays){

if(
    !hasSpecial ||
    !specialTexture.complete ||
    specialTexture.naturalWidth === 0
) return; // ✅ OK because still inside function

for(let y=0;y<map.length;y++){
    for(let x=0;x<map[y].length;x++){

        if(map[y][x] !== 4) continue;

        const dx = x+0.5-player.x;
        const dy = y+0.5-player.y;

        const dist = Math.sqrt(dx*dx+dy*dy);

        let angle = Math.atan2(dy,dx) - player.angle;
        angle = ((angle+Math.PI)%(Math.PI*2)) - Math.PI;

        if(Math.abs(angle) >= player.fov/2) continue;

        const screenX =
            ((angle+player.fov/2)/player.fov) * canvas.width;

        const rayIndex = Math.floor(screenX);

        if(rayIndex < 0 || rayIndex >= rays.length) continue;

        if(dist > rays[rayIndex].distance) continue;

        const size = canvas.height / dist;

        ctx.drawImage(
            specialTexture,
            screenX - size/2,
            canvas.height/2 - size/2,
            size,
            size
        );
    }
}
}

ctx.moveTo(canvas.width-s,canvas.height-10);
ctx.lineTo(canvas.width-10,canvas.height-10);
ctx.lineTo(canvas.width-10,canvas.height-s);

ctx.stroke();

ctx.restore();


}

window.addEventListener("keydown", e => {
    const key = e.key.toLowerCase();

    keys[key] = true;

    if(key === "m"){
        showMinimap = !showMinimap;
    }
});

window.addEventListener("keydown",e=>{

if(e.key.toLowerCase()==="f"){
flashlightOn=!flashlightOn;
}

});
// =======================
// LOOP
// =======================
function gameLoop(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    // MENU
    if(gameState === "menu"){
        drawMenu();
        requestAnimationFrame(gameLoop);
        return;
    }

    // CREDITS
    if(gameState === "credits"){
        drawCredits();
        requestAnimationFrame(gameLoop);
        return;
    }

    // LORE
    if(gameState === "lore"){
        drawLore();
        requestAnimationFrame(gameLoop);
        return;
    }
    // SETTINGS
if(gameState === "settings"){
    drawSettings();
    requestAnimationFrame(gameLoop);
    return;
}
    // GAME
    if(gameState === "playing"){
    updatePlayer();
    updateEnemies();

    const rays = castRays();

   

render3D(rays);

drawSpecial(rays);

drawExit(rays);

drawSprites(rays);

ctx.restore();

    if(showMinimap){
    drawMiniMap(ctx, map, player, rays, enemies);
}

drawFlashlight();

drawCameraEffect();

drawJumpscare();
}

    requestAnimationFrame(gameLoop);
}
loadLevel(0);
gameLoop();

</script>
